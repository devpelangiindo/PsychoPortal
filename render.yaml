databases:
  - name: psychoportal-db
    plan: basic-256mb
    databaseName: psychoportal
    user: psychoportal

services:
  - type: web
    name: psychoportal-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run start:prod
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: psychoportal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PAYLOAD_PUBLIC_SERVER_URL
        value: https://psychoportal-cms.onrender.com
      - key: MIDTRANS_PRODUCTION_SERVER_KEY
        sync: false
      - key: MIDTRANS_PRODUCTION_CLIENT_KEY
        sync: false
      - key: MIDTRANS_PRODUCTION_MERCHANT_ID
        sync: false
      - key: VITE_MIDTRANS_PRODUCTION_CLIENT_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: psychoportal-cms
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/cms run build
    startCommand: pnpm --filter @workspace/cms run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: psychoportal-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: PAYLOAD_PUBLIC_SERVER_URL
        value: https://psychoportal-cms.onrender.com
      - key: DEFAULT_OBJECT_STORAGE_BUCKET_ID
        sync: false

  - type: web
    name: psychoportal-marketing
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && PORT=8081 BASE_PATH=/ pnpm --filter @workspace/marketing-site run build
    staticPublishPath: artifacts/marketing-site/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_CMS_BASE_URL
        value: https://psychoportal-cms.onrender.com
      - key: VITE_ASESMEN_PLATFORM_URL
        value: https://psychoportal-asesmen.onrender.com/asesmen/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: psychoportal-asesmen
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && PORT=8084 BASE_PATH=/asesmen/ pnpm --filter @workspace/asesmen-platform run build
    staticPublishPath: artifacts/asesmen-platform/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://psychoportal-api.onrender.com
      - key: VITE_MAIN_SITE_URL
        value: https://psychoportal-marketing.onrender.com
      - key: VITE_MIDTRANS_PRODUCTION_CLIENT_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
