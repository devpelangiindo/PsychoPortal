databases:
  - name: psychoportal-db
    plan: basic-256mb
    databaseName: psychoportal
    user: psychoportal

services:
  - type: web
    name: psychoportal-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/api-server run build
    # Keep schema changes out of service startup: drizzle-kit push can drop populated tables.
    startCommand: pnpm --filter @workspace/api-server run start:prod
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: psychoportal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: MIDTRANS_PRODUCTION_SERVER_KEY
        sync: false
      - key: MIDTRANS_PRODUCTION_CLIENT_KEY
        sync: false
      - key: MIDTRANS_PRODUCTION_MERCHANT_ID
        sync: false
      - key: VITE_MIDTRANS_PRODUCTION_CLIENT_KEY
        sync: false
      - key: ASESMEN_SITE_URL
        value: https://asesmen.pi-psychology.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://pi-psychology.com,https://www.pi-psychology.com,https://asesmen.pi-psychology.com,https://psychoportal-asesmen-4djc.onrender.com,https://psychoportal-marketing-oekw.onrender.com
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: psychoportal-marketing
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --prod=false && PORT=8081 BASE_PATH=/ pnpm --filter @workspace/marketing-site run build
    staticPublishPath: artifacts/marketing-site/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_ASESMEN_PLATFORM_URL
        value: https://asesmen.pi-psychology.com
      - key: VITE_ASESMEN_API_URL
        value: https://psychoportal-api-k3k5.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: psychoportal-asesmen
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --prod=false && PORT=8084 BASE_PATH=/ pnpm --filter @workspace/asesmen-platform run build
    staticPublishPath: artifacts/asesmen-platform/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://psychoportal-api-k3k5.onrender.com
      - key: VITE_MAIN_SITE_URL
        value: https://pi-psychology.com
      - key: VITE_MIDTRANS_PRODUCTION_CLIENT_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
