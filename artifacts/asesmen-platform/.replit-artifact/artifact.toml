kind = "web"
previewPath = "/"
title = "Asesmen Platform – Rumah Psikologi Pelangi Indonesia"
version = "1.0.0"
id = "artifacts/asesmen-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20784

[services.development]
run = "pnpm --filter @workspace/asesmen-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/asesmen-platform", "run", "build" ]
publicDir = "artifacts/asesmen-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20784"
BASE_PATH = "/"
